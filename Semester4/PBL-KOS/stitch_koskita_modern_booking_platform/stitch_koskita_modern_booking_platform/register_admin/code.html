<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Secure Admin Registration | KosKita</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "secondary-fixed": "#d7e3fa",
                    "inverse-surface": "#2f3034",
                    "secondary-container": "#d7e3fa",
                    "on-error": "#ffffff",
                    "surface-variant": "#e3e2e7",
                    "on-error-container": "#93000a",
                    "tertiary-container": "#643700",
                    "surface-container-low": "#f4f3f8",
                    "surface": "#faf9fe",
                    "secondary-fixed-dim": "#bbc7dd",
                    "tertiary-fixed": "#ffdcbf",
                    "on-surface-variant": "#43474f",
                    "on-secondary": "#ffffff",
                    "inverse-on-surface": "#f1f0f5",
                    "surface-container-lowest": "#ffffff",
                    "on-tertiary-container": "#e2a163",
                    "surface-tint": "#405e96",
                    "primary": "#012a60",
                    "error": "#ba1a1a",
                    "on-tertiary": "#ffffff",
                    "primary-fixed": "#d8e2ff",
                    "surface-bright": "#faf9fe",
                    "surface-dim": "#dad9df",
                    "inverse-primary": "#adc6ff",
                    "primary-container": "#214177",
                    "on-secondary-fixed-variant": "#3c475a",
                    "primary-fixed-dim": "#adc6ff",
                    "tertiary-fixed-dim": "#fdb878",
                    "error-container": "#ffdad6",
                    "on-primary-container": "#91aeec",
                    "outline-variant": "#c4c6d1",
                    "on-surface": "#1a1b1f",
                    "on-primary": "#ffffff",
                    "outline": "#747781",
                    "background": "#faf9fe",
                    "on-secondary-container": "#596578",
                    "on-secondary-fixed": "#101c2c",
                    "on-primary-fixed-variant": "#27467c",
                    "on-tertiary-fixed": "#2d1600",
                    "surface-container-high": "#e8e7ed",
                    "on-background": "#1a1b1f",
                    "secondary": "#535f72",
                    "surface-container-highest": "#e3e2e7",
                    "tertiary": "#452400",
                    "on-primary-fixed": "#001a41",
                    "surface-container": "#eeedf2",
                    "on-tertiary-fixed-variant": "#6a3c04"
            },
            "borderRadius": {
                    "DEFAULT": "1rem",
                    "lg": "2rem",
                    "xl": "3rem",
                    "full": "9999px"
            },
            "spacing": {
                    "stack-sm": "12px",
                    "stack-lg": "48px",
                    "container-max": "1440px",
                    "unit": "4px",
                    "stack-md": "24px",
                    "margin-page": "48px",
                    "gutter": "24px"
            },
            "fontFamily": {
                    "display-xl": ["Poppins"],
                    "label-caps": ["Inter"],
                    "body-sm": ["Inter"],
                    "body-md": ["Inter"],
                    "h1": ["Poppins"],
                    "display-lg": ["Poppins"],
                    "body-lg": ["Inter"],
                    "h2": ["Poppins"]
            },
            "fontSize": {
                    "display-xl": ["48px", {"lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "label-caps": ["12px", {"lineHeight": "1", "letterSpacing": "0.05em", "fontWeight": "600"}],
                    "body-sm": ["14px", {"lineHeight": "1.5", "fontWeight": "400"}],
                    "body-md": ["16px", {"lineHeight": "1.5", "fontWeight": "400"}],
                    "h1": ["24px", {"lineHeight": "1.3", "fontWeight": "600"}],
                    "display-lg": ["32px", {"lineHeight": "1.2", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                    "body-lg": ["18px", {"lineHeight": "1.6", "fontWeight": "400"}],
                    "h2": ["20px", {"lineHeight": "1.4", "fontWeight": "600"}]
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .bg-pattern {
            background-color: #faf9fe;
            background-image: radial-gradient(#012a60 0.5px, transparent 0.5px), radial-gradient(#012a60 0.5px, #faf9fe 0.5px);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
            opacity: 0.05;
        }
        .auth-card-shadow {
            box-shadow: 0px 20px 50px rgba(0, 0, 0, 0.08);
        }
    </style>
</head>
<body class="bg-background font-body-md text-on-surface min-h-screen flex flex-col relative overflow-x-hidden">
<!-- Background Layer -->
<div class="fixed inset-0 bg-pattern z-0 pointer-events-none"></div>
<!-- Main Content Canvas -->
<main class="relative z-10 flex-grow flex items-center justify-center px-gutter py-stack-lg">
<div class="w-full max-w-[640px] bg-surface-container-lowest auth-card-shadow rounded-lg p-stack-lg border border-outline-variant/20">
<!-- Brand Header -->
<div class="text-center mb-stack-lg">
<div class="flex justify-center mb-stack-sm">
<span class="material-symbols-outlined text-primary text-[48px]" style="font-variation-settings: 'FILL' 1;">admin_panel_settings</span>
</div>
<h1 class="font-display-lg text-display-lg text-primary tracking-tight">KosKita Portal</h1>
<p class="text-on-surface-variant font-body-md mt-2">Enterprise Administrator Registration</p>
</div>
<!-- Registration Form -->
<form class="space-y-gutter">
<!-- Section: Personal & Identification -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-gutter">
<div class="relative">
<input class="peer w-full h-14 px-4 pt-4 pb-2 bg-surface-container-low border border-outline-variant rounded-[16px] focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all placeholder-transparent font-body-md" id="full_name" placeholder=" " type="text"/>
<label class="absolute left-4 top-1 text-label-caps text-outline transition-all peer-placeholder-shown:top-4 peer-placeholder-shown:text-body-md peer-focus:top-1 peer-focus:text-label-caps peer-focus:text-primary cursor-text" for="full_name">Full Name</label>
</div>
<div class="relative">
<input class="peer w-full h-14 px-4 pt-4 pb-2 bg-surface-container-low border border-outline-variant rounded-[16px] focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all placeholder-transparent font-body-md" id="email" placeholder=" " type="email"/>
<label class="absolute left-4 top-1 text-label-caps text-outline transition-all peer-placeholder-shown:top-4 peer-placeholder-shown:text-body-md peer-focus:top-1 peer-focus:text-label-caps peer-focus:text-primary cursor-text" for="email">Admin Email</label>
</div>
<div class="relative">
<input class="peer w-full h-14 px-4 pt-4 pb-2 bg-surface-container-low border border-outline-variant rounded-[16px] focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all placeholder-transparent font-body-md" id="employee_id" placeholder=" " type="text"/>
<label class="absolute left-4 top-1 text-label-caps text-outline transition-all peer-placeholder-shown:top-4 peer-placeholder-shown:text-body-md peer-focus:top-1 peer-focus:text-label-caps peer-focus:text-primary cursor-text" for="employee_id">Employee ID</label>
</div>
<div class="relative">
<input class="peer w-full h-14 px-4 pt-4 pb-2 bg-surface-container-low border border-outline-variant rounded-[16px] focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all placeholder-transparent font-body-md" id="phone" placeholder=" " type="tel"/>
<label class="absolute left-4 top-1 text-label-caps text-outline transition-all peer-placeholder-shown:top-4 peer-placeholder-shown:text-body-md peer-focus:top-1 peer-focus:text-label-caps peer-focus:text-primary cursor-text" for="phone">Phone Number</label>
</div>
</div>
<!-- Section: Role & Security -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-gutter border-t border-outline-variant/10 pt-gutter">
<div class="relative md:col-span-2">
<select class="peer w-full h-14 px-4 pt-4 pb-2 bg-surface-container-low border border-outline-variant rounded-[16px] focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all font-body-md appearance-none" id="admin_role">
<option disabled="" hidden="" selected="" value=""></option>
<option value="super_admin">Super Admin</option>
<option value="moderator">Moderator</option>
<option value="finance">Finance</option>
</select>
<label class="absolute left-4 top-1 text-label-caps text-outline cursor-text" for="admin_role">Admin Role</label>
<span class="material-symbols-outlined absolute right-4 top-4 text-on-surface-variant pointer-events-none">expand_more</span>
</div>
<div class="relative">
<input class="peer w-full h-14 px-4 pt-4 pb-2 bg-surface-container-low border border-outline-variant rounded-[16px] focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all placeholder-transparent font-body-md" id="password" placeholder=" " type="password"/>
<label class="absolute left-4 top-1 text-label-caps text-outline transition-all peer-placeholder-shown:top-4 peer-placeholder-shown:text-body-md peer-focus:top-1 peer-focus:text-label-caps peer-focus:text-primary cursor-text" for="password">Password</label>
</div>
<div class="relative">
<input class="peer w-full h-14 px-4 pt-4 pb-2 bg-surface-container-low border border-outline-variant rounded-[16px] focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all placeholder-transparent font-body-md" id="confirm_password" placeholder=" " type="password"/>
<label class="absolute left-4 top-1 text-label-caps text-outline transition-all peer-placeholder-shown:top-4 peer-placeholder-shown:text-body-md peer-focus:top-1 peer-focus:text-label-caps peer-focus:text-primary cursor-text" for="confirm_password">Confirm Password</label>
</div>
<div class="relative md:col-span-2">
<input class="peer w-full h-14 px-4 pt-4 pb-2 bg-surface-container-low border border-outline-variant rounded-[16px] focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all placeholder-transparent font-body-md tracking-[0.5em]" id="security_pin" maxlength="6" placeholder=" " type="password"/>
<label class="absolute left-4 top-1 text-label-caps text-outline transition-all peer-placeholder-shown:top-4 peer-placeholder-shown:text-body-md peer-focus:top-1 peer-focus:text-label-caps peer-focus:text-primary cursor-text tracking-normal" for="security_pin">6-Digit Security PIN</label>
<span class="material-symbols-outlined absolute right-4 top-4 text-on-surface-variant/50">lock</span>
</div>
</div>
<!-- Terms & Action -->
<div class="space-y-stack-md pt-stack-sm">
<div class="flex items-start gap-3 px-1">
<div class="mt-1">
<input class="w-5 h-5 rounded border-outline-variant text-primary focus:ring-primary bg-surface-container-low" id="terms" type="checkbox"/>
</div>
<label class="text-body-sm text-on-surface-variant" for="terms">
                            I acknowledge that administrative access provides control over sensitive data and agree to comply with the <span class="text-primary font-semibold hover:underline cursor-pointer">Security Protocol</span> and <span class="text-primary font-semibold hover:underline cursor-pointer">Data Privacy Policy</span>.
                        </label>
</div>
<button class="w-full h-14 bg-primary text-on-primary rounded-full font-h2 hover:shadow-lg active:scale-[0.98] transition-all flex items-center justify-center gap-2" type="submit">
                        Complete Registration
                        <span class="material-symbols-outlined">how_to_reg</span>
</button>
<div class="text-center">
<p class="text-body-sm text-on-surface-variant">Already have an admin account? <span class="text-primary font-semibold hover:underline cursor-pointer">Sign In</span></p>
</div>
</div>
</form>
</div>
</main>
<!-- Footer Overlay -->
<footer class="relative z-10 w-full px-margin-page py-stack-md bg-surface-container-highest flex flex-col md:flex-row justify-between items-center gap-4 mt-auto">
<p class="font-body-sm text-on-surface-variant">© 2024 KosKita Properties. Luxury Living Simplified.</p>
<div class="flex gap-gutter">
<a class="font-body-sm text-on-surface-variant hover:text-primary transition-colors" href="#">Privacy Policy</a>
<a class="font-body-sm text-on-surface-variant hover:text-primary transition-colors" href="#">Terms of Service</a>
<a class="font-body-sm text-on-surface-variant hover:text-primary transition-colors" href="#">Help Center</a>
</div>
</footer>
<!-- Aesthetic Decorative Elements -->
<div class="fixed top-0 left-0 w-64 h-64 bg-primary/5 rounded-full blur-3xl -translate-x-1/2 -translate-y-1/2 z-0"></div>
<div class="fixed bottom-0 right-0 w-96 h-96 bg-secondary-fixed/20 rounded-full blur-3xl translate-x-1/3 translate-y-1/3 z-0"></div>
</body></html>
